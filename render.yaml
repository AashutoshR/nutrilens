# Render Blueprint: New > Blueprint, pick this repository, then paste your Gemini key when asked.
services:
  - type: web
    name: nutrilens
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false # secret: entered in the Render dashboard, never stored in the repository
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
